name: Release Java SDK and CLI

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify version and build native publications
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "v$(cat VERSION)" ]]
          ./gradlew --no-daemon check releaseArchive distZip distTar
          tar -xf "build/distributions/myscoutee-client-$(cat VERSION).tar" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/myscoutee-client-$(cat VERSION)/bin/myscoutee-client" > "$RUNNER_TEMP/cli-usage.txt"
          grep -Fq "MyScoutee API client" "$RUNNER_TEMP/cli-usage.txt"
      - name: Publish Maven artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository
      - name: Verify published Maven bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, os, pathlib, urllib.request
          version = pathlib.Path('VERSION').read_text().strip()
          root = pathlib.Path('build/repository')
          files = sorted((root / 'com/myscoutee/myscoutee-client' / version).iterdir())
          auth = base64.b64encode((os.environ['GITHUB_ACTOR'] + ':' + os.environ['GITHUB_TOKEN']).encode()).decode()
          checked = 0
          for file in files:
              if file.suffix not in {'.jar', '.pom', '.module'}:
                  continue
              request = urllib.request.Request('https://maven.pkg.github.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + file.relative_to(root).as_posix(), headers={'Authorization': 'Basic ' + auth})
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert hashlib.sha256(response.read()).digest() == hashlib.sha256(file.read_bytes()).digest(), file.name
              checked += 1
          assert checked == 4, checked
          print('Verified SDK, sources, POM and module metadata in Maven registry.')
          PYTHON
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p "$RUNNER_TEMP/release"
          cp build/releases/*.zip build/distributions/*.zip build/distributions/*.tar build/libs/*.jar "$RUNNER_TEMP/release/"
          (cd "$RUNNER_TEMP/release" && sha256sum *) > "$RUNNER_TEMP/SHA256SUMS"
          printf 'MSC-127: Java SDK and CLI **%s**, Java 17+.\n\nMaven: `com.myscoutee:myscoutee-client:%s` at `https://maven.pkg.github.com/fssrepository/myscoutee-client`.\n\nSource: `%s`. Native tests and the extracted CLI passed. Published SDK, sources and metadata match the staged Maven artifacts.\n' "$version" "$version" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* "$RUNNER_TEMP/SHA256SUMS" --verify-tag \
            --title "MyScoutee Java Client $version" --notes-file "$RUNNER_TEMP/release-notes.md"
