        '409':
          description: Version or lifecycle conflict; read again and ask the user before retrying a mutation
    post:
      summary: Create up to 1000 draft Work campaigns
      description: >-
        Requires a key issued by a Work profile with accepted group membership.
        Creates drafts; publishing and editing use the existing application editor.
        Each caller id is idempotent. A repeated id returns the already allocated
