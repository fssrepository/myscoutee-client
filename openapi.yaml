webhooks:
  resourceChanged:
    post:
      summary: Asset or event change delivered to the registered callback URL
      parameters:
        - in: header
          name: X-MyScoutee-Webhook-Id
          required: true
          schema:
            type: string
            format: uuid
          description: Equals deliveryId and is the receiver's deduplication key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        '2XX':
          description: Delivery accepted; any 2xx response stops retries.

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: MyScoutee integration token
    clientId:
      type: apiKey
      in: header
      name: X-MyScoutee-Client-Id
  schemas:
    ConnectResponse:
      type: object
      required: [connected, maxBatchSize, profileId, operations, inviteGroups]
      properties:
        connected:
          type: boolean
          const: true
        maxBatchSize:
          type: integer
          const: 1000
        profileId:
          type: string
          description: Profile that issued the key; independent of interactive group selection.
        profileName:
          type: [string, 'null']
        groupId:
          type: [string, 'null']
          description: Null for the base profile; event creation uses this group.
        groupName:
          type: [string, 'null']
        operations:
          type: array
          items: {type: string}
          description: >-
            Available data operations under the current API policies. Resource ownership,
            per-resource grants, validation and lifecycle checks still apply at execution.
            Consumers must intersect these IDs with their implemented operations.
        accessMode:
          $ref: '#/components/schemas/IntegrationAccessMode'
        inviteGroups:
          type: array
          description: Groups administered by this identity, eligible for group invitations.
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
    WatchRequest:
      type: object
      properties:
        callbackUrl:
          type: [string, 'null']
          format: uri
          description: Required when enabled is true.
        events:
          type: array
          items:
            type: string
            enum: [event.changed, asset.changed, event.encounters]
          description: Empty or omitted selects event.changed and asset.changed. Subscribe explicitly to event.encounters before session completion.
        enabled:
          type: boolean
          default: true
    WatchResponse:
      type: object
      required: [enabled, events]
      properties:
        enabled:
          type: boolean
        callbackUrl:
          type: [string, 'null']
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [event.changed, asset.changed, event.encounters]
    WebhookMessage:
      type: object
      required: [deliveryId, type, occurredAt, resource]
      properties:
        deliveryId:
          type: string
          format: uuid
        type:
          type: string
          enum: [event.changed, asset.changed, event.encounters]
        occurredAt:
          type: string
          format: date-time
        resource:
          type: object
          required: [externalId]
          properties:
            id:
              type: [string, 'null']
              format: uuid
              description: Caller-owned request UUID when the resource originated through this API.
            externalId:
              type: string
              format: uuid
              description: MyScoutee resource UUID.
            title:
              type: [string, 'null']
            status:
              type: [string, 'null']
            sourceLink:
              type: [string, 'null']
              description: Organizer event-page link in event.changed snapshots.
            mode:
              type: string
              enum: [Casual, Tournament, Mingle]
            mingleConfiguration:
              oneOf:
                - {$ref: '#/components/schemas/MingleConfiguration'}
                - {type: 'null'}
            revision:
              type: integer
              description: Completed session revision for event.encounters.
            pairs:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/EncounterPair'}
            total: {type: integer, minimum: 0}
            offset: {type: integer, minimum: 0}
            nextOffset: {type: [integer, 'null']}
            change:
              type: object
              description: Present for a participant join or membership-state change.
              properties:
                kind:
                  type: string
                  const: participant
                status:
                  type: [string, 'null']
                role:
                  type: [string, 'null']
                actionAt:
                  type: [string, 'null']
                  format: date-time
                participant:
                  type: object
                  description: Minimal participant projection; no email address or internal user id.
                  properties:
                    name:
                      type: [string, 'null']
                    age:
                      type: [integer, 'null']
                    gender:
                      type: [string, 'null']
                    profileImage:
                      type: [string, 'null']
                      format: uri-reference
    AssetBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AssetItem'
    EventBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EventItem'
    AssetItem:
      type: object
      required: [id, type, title, capacityTotal, quantity]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned stable UUID.
        type:
          type: string
          enum: [Transport, Accommodation, Supplies]
        title:
          type: string
        subtitle:
          type: string
        category:
          type: string
        city:
          type: string
        capacityTotal:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        details:
          type: string
        sourceLink:
          type: string
          format: uri
        routes:
          type: array
          items:
            type: string
          description: Required with at least one non-blank location for Accommodation assets.
        visibility:
          type: string
    CampaignBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/CampaignItem'}
    CampaignItem:
      type: object
      required: [id, title, description, kind, category]
      properties:
        id: {type: string, format: uuid, description: Caller-generated idempotency ID}
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        kind: {type: string, enum: [work, business, both]}
        category: {type: string, enum: [technology, creative, services, education, community, other]}
    EventItem:
      type: object
      required: [id, title, subtitle, startAt, endAt, capacityMin, capacityMax]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned stable UUID.
        title:
          type: string
        subtitle:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        location:
          type: string
        capacityMin:
          type: integer
          minimum: 0
        capacityMax:
          type: integer
          minimum: 0
          description: Must be greater than or equal to capacityMin.
        visibility:
          type: string
        status:
          type: string
          enum: [draft, active]
        sourceLink:
          type: string
          format: uri
          description: External organizer event-page link, using the same contract as assets.
        mode:
          type: string
          enum: [Casual, Tournament, Mingle]
          description: UI names are Standard, Tournament and Speed meeting; wire values remain unchanged.
          default: Casual
        mingleConfiguration:
          $ref: '#/components/schemas/MingleConfiguration'
        topics:
          type: array
          items:
            type: string
    BatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'
    BatchResult:
      type: object
      required: [id, result]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned UUID from the request.
        externalId:
          type: [string, 'null']
          format: uuid
          description: MyScoutee resource UUID, returned for created or existing items.
        result:
          type: string
          enum: [created, existing, rejected]
        error:
          type: [string, 'null']

    MingleConfiguration:
      type: object
      required: [groupSize, plannedRounds, roundDurationMinutes, breakDurationMinutes, requireGenderBalance]
      properties:
        groupSize: {type: integer, minimum: 2, maximum: 20}
        plannedRounds: {type: integer, minimum: 1, maximum: 100}
        roundDurationMinutes: {type: integer, minimum: 1, maximum: 240}
        breakDurationMinutes: {type: integer, minimum: 0, maximum: 60}
        requireGenderBalance: {type: boolean}
    EventResponse:
      type: object
      properties:
        id: {type: [string, 'null'], description: Caller-owned event ID when linked}
        externalId: {type: string, description: MyScoutee event ID}
        title: {type: [string, 'null']}
        status: {type: [string, 'null']}
        sourceLink: {type: [string, 'null'], description: External organizer event-page URL}
        mode: {type: string, enum: [Casual, Tournament, Mingle]}
        mingleConfiguration:
          oneOf:
            - {$ref: '#/components/schemas/MingleConfiguration'}
            - {type: 'null'}
    EncounterParticipant:
      type: object
      properties:
        id: {type: [string, 'null'], description: Partner participant ID when linked}
        externalId: {type: string, description: Opaque organizer-scoped participant identifier}
    EncounterPair:
      type: object
      properties:
        first: {$ref: '#/components/schemas/EncounterParticipant'}
        second: {$ref: '#/components/schemas/EncounterParticipant'}
    EncountersResponse:
      type: object
      properties:
        id: {type: [string, 'null']}
        externalId: {type: string}
        revision: {type: integer}
        pairs:
