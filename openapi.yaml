        '401':
          description: Invalid or expired credential
        '403':
          description: Access pack or normal domain permission denied
        '404':
          description: Record not found or not visible
        '409':
          description: Version or lifecycle conflict; read again and ask the user before retrying a mutation
    post:
      summary: Create up to 1000 events
      description: >-
        Each caller id is idempotent. A repeated id returns the already allocated
