openapi: 3.1.0
info:
  title: MyScoutee Integration API
  version: 1.6.0
  description: >-
    Profile-bound integration API with Blocked, Write, Read and Full access packs.
    Write retains existing batch creation, invitations and managed-event reads.
    Write permits the supported organizing commands. Read adds personal and workspace reads; Full additionally permits OAuth MCP Events; normal visibility and ownership still apply.
    Personal judgments, ratings, feedback, ballots, joining/leaving, invitations acceptance,
    endorsements, offers and offer decisions require the user in the application and are not API operations.
    Admin and operator profiles expose authorized statistics only; no role mutations. The main MCP link defaults to Blocked.
    MCP effective access is the lower of its main-link pack and the client pack.
    Keys belong to the profile that issued them. Event operations use that profile's
    group (or the base profile), independently of the account's interactive group
    selection. Group-profile keys require continued accepted group membership.
    Asset creation requires a base-profile key; group-profile keys cannot create assets.
    Campaign creation requires a Work profile key and creates drafts in that workspace.
    No group header or group parameter is needed.
servers:
  - url: https://example.com/api/integrations/v1
security:
  - bearerToken: []
    clientId: []
paths:
  /help/active:
    servers:
      - url: /api
    get:
      operationId: activeHelp
      summary: Read the common active help revision
      description: Public shared help for the app and MCP. No integration token or client ID is required. Only the active revision is returned; no admin drafts or audit entries.
      security: []
      parameters:
        - name: lang
          in: query
          schema: {type: string, enum: [en, hu], default: en}
      responses:
        '200':
          description: Active localized help (activeRevision is null if none is published)
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeRevision:
                    type: object
                    nullable: true
                    properties:
                      id: {type: string}
                      version: {type: integer}
                      lang: {type: string}
                      title: {type: string}
                      summary: {type: string}
                      description: {type: string}
                      active: {type: boolean}
                      sections:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            icon: {type: string}
                            title: {type: string}
                            blurb: {type: string}
                            contentHtml: {type: string}
                  revisions: {type: array, items: {type: object}}
                  auditTrail: {type: array, maxItems: 0, items: {type: object}}
                  availableLanguages: {type: array, items: {type: object}}
  /events/{externalId}:
    get:
      summary: Read a managed event including its organizer link and Mingle configuration
      operationId: event
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Managed event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventResponse'}
        '404': {description: Event not found or not managed by the token owner}
  /events/{externalId}/encounters:
    get:
      summary: Read unique pairs from completed Speed meeting table rounds
      operationId: encounters
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      responses:
        '200':
          description: Completed encounters page; repeat with nextOffset while non-null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EncountersResponse'}
        '404': {description: Event not found or not managed by the token owner}
        '409': {description: Mingle has not completed}
  /events/{externalId}/invites:
    post:
      summary: Create claimable participant invitation links for a managed event
      description: >-
        Repeating the same organizer/event/participant ID returns the same link.
        Opening the link requires application sign-in or registration. Claiming
        binds the participant ID to that account and creates an ordinary pending
        event invitation; it does not accept participation or bypass payment.
      operationId: inviteParticipants
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInviteRequest'}
      responses:
        '200':
          description: Invitation links in request order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantInvitesResponse'}
        '400': {description: Invalid participant IDs or batch size}
        '403': {description: Event invitation is not permitted}
        '404': {description: Event not found or not managed by the token owner}
  /groups/{groupId}/invites:
    post:
      summary: Create claimable participant invitation links for a group administered by the token owner
      description: >-
        Repeating the same organizer/group/participant ID returns the same link.
        Opening the link requires application sign-in or registration. Claiming
        binds the participant ID to that account, accepts group membership through
        the normal invitation flow and creates its workspace profile. The application
        selects that group as the active workspace after sign-in or registration.
      operationId: inviteGroupParticipants
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInviteRequest'}
      responses:
        '200':
          description: Invitation links in request order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantInvitesResponse'}
        '400': {description: Invalid participant IDs or batch size}
        '403': {description: Token owner is not a group administrator}
        '404': {description: Group not found or not visible to the token owner}
  /connect:
    post:
      summary: Validate the connection and discover the authenticated profile and operations
      operationId: connect
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '401':
          description: Missing, invalid, expired, revoked, or occupied token
  /watch:
    post:
      summary: Register or disable this client's callback
      description: >-
        Each claimed token/client pair has one callback registration. MyScoutee
        posts event.changed, asset.changed and explicitly selected event.encounters messages for resources
        managed or owned by the token owner. Send enabled=false to disable it.
        Production callback URLs must use HTTPS and resolve to a public address.
      operationId: configureWatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
      responses:
        '200':
          description: Current callback registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchResponse'
        '400':
          description: Invalid callback URL or event type
        '401':
          description: Authentication or client claim failed
  /assets:
    get:
      operationId: listAssets
      summary: Discover visible assets with a base-profile key. Read or Full access required.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          default: Transport
          enum:
          - Transport
          - Accommodation
          - Supplies
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: Cursor returned by the preceding page; omit for the first page.
      responses:
        '200':
          description: Authorized domain result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResult'
        '400':
          description: Invalid arguments or page size
        '401':
          description: Invalid or expired credential
        '403':
          description: Access pack or normal domain permission denied
        '404':
          description: Record not found or not visible
        '409':
          description: Version or lifecycle conflict; read again and ask the user before retrying a mutation
    post:
      summary: Create up to 1000 assets
      description: >-
        Requires a key issued by the base profile. Assets belong to that base profile.
        Each caller id is idempotent. A repeated id returns the already allocated
        MyScoutee externalId. An optional image can be sent as multipart bytes;
        MyScoutee never downloads an image URL.
      operationId: createAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/AssetItem'
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  required: [request]
                  properties:
                    request:
                      $ref: '#/components/schemas/AssetBatchRequest'
                - type: object
                  additionalProperties:
                    type: string
                    format: binary
            encoding:
              request:
                contentType: application/json
            description: >-
              The request part contains the JSON batch. Every optional file part
              is named with the id of its item and contains the image bytes.
      responses:
        '200':
          description: Per-item creation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch
        '401':
          description: Authentication or client claim failed
        '403':
          description: Asset creation requires a base-profile integration key
  /events:
    get:
      operationId: listEvents
      summary: List events visible to the issuing profile; choose events, hosting, attending, invitations or trash.
        Read or Full access required.
      parameters:
