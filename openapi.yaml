                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/CampaignItem'
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  required: [request]
                  properties:
                    request:
                      $ref: '#/components/schemas/CampaignBatchRequest'
                - type: object
                  additionalProperties:
                    type: string
                    format: binary
            encoding:
              request:
                contentType: application/json
            description: >-
              The request part contains the JSON batch. Every optional file part
              is named with the id of its item and contains the image bytes.
      responses:
        '200':
          description: Per-item creation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch
        '401':
          description: Authentication or client claim failed
        '403':
          description: The authenticated profile is not an accepted Work group member
