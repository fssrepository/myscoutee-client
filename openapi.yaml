openapi: 3.1.0
info:
  title: MyScoutee Integration API
  version: 1.0.1
  description: Batch write, owner-scoped event read and callback API for external asset and event systems.
servers:
  - url: https://example.com/api/integrations/v1
security:
  - bearerToken: []
    clientId: []
paths:
  /events/{externalId}:
    get:
      summary: Read a managed event including its organizer link and Mingle configuration
      operationId: event
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Managed event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventResponse'}
        '404': {description: Event not found or not managed by the token owner}
  /events/{externalId}/encounters:
    get:
      summary: Read unique pairs from completed Speed meeting table rounds
      operationId: encounters
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      responses:
        '200':
          description: Completed encounters page; repeat with nextOffset while non-null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EncountersResponse'}
        '404': {description: Event not found or not managed by the token owner}
        '409': {description: Mingle has not completed}
  /events/{externalId}/invites:
    post:
      summary: Create claimable participant invitation links for a managed event
      description: >-
        Repeating the same organizer/event/participant ID returns the same link.
        Opening the link requires application sign-in or registration. Claiming
        binds the participant ID to that account and creates an ordinary pending
        event invitation; it does not accept participation or bypass payment.
      operationId: inviteParticipants
      parameters:
        - name: externalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInviteRequest'}
      responses:
        '200':
          description: Invitation links in request order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantInvitesResponse'}
        '400': {description: Invalid participant IDs or batch size}
        '403': {description: Event invitation is not permitted}
        '404': {description: Event not found or not managed by the token owner}
  /groups/{groupId}/invites:
    post:
      summary: Create claimable participant invitation links for a group administered by the token owner
      description: >-
        Repeating the same organizer/group/participant ID returns the same link.
        Opening the link requires application sign-in or registration. Claiming
        binds the participant ID to that account and creates an ordinary pending
        group invitation; it does not accept membership or create a workspace profile.
      operationId: inviteGroupParticipants
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInviteRequest'}
      responses:
        '200':
          description: Invitation links in request order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantInvitesResponse'}
        '400': {description: Invalid participant IDs or batch size}
        '403': {description: Token owner is not a group administrator}
        '404': {description: Group not found or not visible to the token owner}
  /connect:
    post:
      summary: Claim a token for this client and validate the connection
      operationId: connect
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '401':
          description: Missing, invalid, expired, revoked, or occupied token
  /watch:
    post:
      summary: Register or disable this client's callback
      description: >-
        Each claimed token/client pair has one callback registration. MyScoutee
        posts event.changed, asset.changed and explicitly selected event.encounters messages for resources
        managed or owned by the token owner. Send enabled=false to disable it.
        Production callback URLs must use HTTPS and resolve to a public address.
      operationId: configureWatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
      responses:
        '200':
          description: Current callback registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchResponse'
        '400':
          description: Invalid callback URL or event type
        '401':
          description: Authentication or client claim failed
  /assets:
    post:
      summary: Create up to 1000 assets
      description: >-
        Each caller id is idempotent. A repeated id returns the already allocated
        MyScoutee externalId. An optional image can be sent as multipart bytes;
        MyScoutee never downloads an image URL.
      operationId: createAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/AssetItem'
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  required: [request]
                  properties:
                    request:
                      $ref: '#/components/schemas/AssetBatchRequest'
                - type: object
                  additionalProperties:
                    type: string
                    format: binary
            encoding:
              request:
                contentType: application/json
            description: >-
              The request part contains the JSON batch. Every optional file part
              is named with the id of its item and contains the image bytes.
      responses:
        '200':
          description: Per-item creation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch
        '401':
          description: Authentication or client claim failed
  /events:
    post:
      summary: Create up to 1000 events
      description: >-
        Each caller id is idempotent. A repeated id returns the already allocated
        MyScoutee externalId. An optional image can be sent as multipart bytes;
        MyScoutee never downloads an image URL.
      operationId: createEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/EventItem'
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  required: [request]
                  properties:
                    request:
                      $ref: '#/components/schemas/EventBatchRequest'
                - type: object
                  additionalProperties:
                    type: string
                    format: binary
            encoding:
              request:
                contentType: application/json
            description: >-
              The request part contains the JSON batch. Every optional file part
              is named with the id of its item and contains the image bytes.
      responses:
        '200':
          description: Per-item creation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch
        '401':
          description: Authentication or client claim failed
webhooks:
  resourceChanged:
    post:
      summary: Asset or event change delivered to the registered callback URL
      parameters:
        - in: header
          name: X-MyScoutee-Webhook-Id
          required: true
          schema:
            type: string
            format: uuid
          description: Equals deliveryId and is the receiver's deduplication key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        '2XX':
          description: Delivery accepted; any 2xx response stops retries.
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: MyScoutee integration token
    clientId:
      type: apiKey
      in: header
      name: X-MyScoutee-Client-Id
  schemas:
    ConnectResponse:
      type: object
      required: [connected, maxBatchSize]
      properties:
        connected:
          type: boolean
          const: true
        maxBatchSize:
          type: integer
          const: 1000
    WatchRequest:
      type: object
      properties:
        callbackUrl:
          type: [string, 'null']
          format: uri
          description: Required when enabled is true.
        events:
          type: array
          items:
            type: string
            enum: [event.changed, asset.changed, event.encounters]
          description: Empty or omitted selects event.changed and asset.changed. Subscribe explicitly to event.encounters before session completion.
        enabled:
          type: boolean
          default: true
    WatchResponse:
      type: object
      required: [enabled, events]
      properties:
        enabled:
          type: boolean
        callbackUrl:
          type: [string, 'null']
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [event.changed, asset.changed, event.encounters]
    WebhookMessage:
      type: object
      required: [deliveryId, type, occurredAt, resource]
      properties:
        deliveryId:
          type: string
          format: uuid
        type:
          type: string
          enum: [event.changed, asset.changed, event.encounters]
        occurredAt:
          type: string
          format: date-time
        resource:
          type: object
          required: [externalId]
          properties:
            id:
              type: [string, 'null']
              format: uuid
              description: Caller-owned request UUID when the resource originated through this API.
            externalId:
              type: string
              format: uuid
              description: MyScoutee resource UUID.
            title:
              type: [string, 'null']
            status:
              type: [string, 'null']
            sourceLink:
              type: [string, 'null']
              description: Organizer event-page link in event.changed snapshots.
            mode:
              type: string
              enum: [Casual, Tournament, Mingle]
            mingleConfiguration:
              oneOf:
                - {$ref: '#/components/schemas/MingleConfiguration'}
                - {type: 'null'}
            revision:
              type: integer
              description: Completed session revision for event.encounters.
            pairs:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/EncounterPair'}
            total: {type: integer, minimum: 0}
            offset: {type: integer, minimum: 0}
            nextOffset: {type: [integer, 'null']}
            change:
              type: object
              description: Present for a participant join or membership-state change.
              properties:
                kind:
                  type: string
                  const: participant
                status:
                  type: [string, 'null']
                role:
                  type: [string, 'null']
                actionAt:
                  type: [string, 'null']
                  format: date-time
                participant:
                  type: object
                  description: Minimal participant projection; no email address or internal user id.
                  properties:
                    name:
                      type: [string, 'null']
                    age:
                      type: [integer, 'null']
                    gender:
                      type: [string, 'null']
                    profileImage:
                      type: [string, 'null']
                      format: uri-reference
    AssetBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AssetItem'
    EventBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EventItem'
    AssetItem:
      type: object
      required: [id, type, title, capacityTotal, quantity]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned stable UUID.
        type:
          type: string
          enum: [Transport, Accommodation, Supplies]
        title:
          type: string
        subtitle:
          type: string
        category:
          type: string
        city:
          type: string
        capacityTotal:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        details:
          type: string
        sourceLink:
          type: string
          format: uri
        routes:
          type: array
          items:
            type: string
          description: Required with at least one non-blank location for Accommodation assets.
        visibility:
          type: string
    EventItem:
      type: object
      required: [id, title, subtitle, startAt, endAt, capacityMin, capacityMax]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned stable UUID.
        title:
          type: string
        subtitle:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        location:
          type: string
        capacityMin:
          type: integer
          minimum: 0
        capacityMax:
          type: integer
          minimum: 0
          description: Must be greater than or equal to capacityMin.
        visibility:
          type: string
        status:
          type: string
          enum: [draft, active]
        sourceLink:
          type: string
          format: uri
          description: External organizer event-page link, using the same contract as assets.
        mode:
          type: string
          enum: [Casual, Tournament, Mingle]
          description: UI names are Standard, Tournament and Speed meeting; wire values remain unchanged.
          default: Casual
        mingleConfiguration:
          $ref: '#/components/schemas/MingleConfiguration'
        topics:
          type: array
          items:
            type: string
    BatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'
    BatchResult:
      type: object
      required: [id, result]
      properties:
        id:
          type: string
          format: uuid
          description: Caller-owned UUID from the request.
        externalId:
          type: [string, 'null']
          format: uuid
          description: MyScoutee resource UUID, returned for created or existing items.
        result:
          type: string
          enum: [created, existing, rejected]
        error:
          type: [string, 'null']

    MingleConfiguration:
      type: object
      required: [groupSize, plannedRounds, roundDurationMinutes, breakDurationMinutes, requireGenderBalance]
      properties:
        groupSize: {type: integer, minimum: 2, maximum: 20}
        plannedRounds: {type: integer, minimum: 1, maximum: 100}
        roundDurationMinutes: {type: integer, minimum: 1, maximum: 240}
        breakDurationMinutes: {type: integer, minimum: 0, maximum: 60}
        requireGenderBalance: {type: boolean}
    EventResponse:
      type: object
      properties:
        id: {type: [string, 'null'], description: Caller-owned event ID when linked}
        externalId: {type: string, description: MyScoutee event ID}
        title: {type: [string, 'null']}
        status: {type: [string, 'null']}
        sourceLink: {type: [string, 'null'], description: External organizer event-page URL}
        mode: {type: string, enum: [Casual, Tournament, Mingle]}
        mingleConfiguration:
          oneOf:
            - {$ref: '#/components/schemas/MingleConfiguration'}
            - {type: 'null'}
    EncounterParticipant:
      type: object
      properties:
        id: {type: [string, 'null'], description: Partner participant ID when linked}
        externalId: {type: string, description: Opaque organizer-scoped participant identifier}
    EncounterPair:
      type: object
      properties:
        first: {$ref: '#/components/schemas/EncounterParticipant'}
        second: {$ref: '#/components/schemas/EncounterParticipant'}
    EncountersResponse:
      type: object
      properties:
        id: {type: [string, 'null']}
        externalId: {type: string}
        revision: {type: integer}
        pairs:
          type: array
          items: {$ref: '#/components/schemas/EncounterPair'}
        total: {type: integer}
        nextOffset: {type: [integer, 'null']}
    ParticipantInviteRequest:
      type: object
      required: [participantIds]
      properties:
        participantIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200}
          description: Caller-owned participant IDs, trimmed and unique within the batch.
    ParticipantInvite:
      type: object
      required: [id, inviteUrl, claimed]
      properties:
        id: {type: string, description: Caller-owned participant ID}
        inviteUrl: {type: string, format: uri, description: Private bearer link for this participant}
        claimed: {type: boolean}
    ParticipantInvitesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ParticipantInvite'}
